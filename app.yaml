name: Keyword-ASR-Local-LLM-TTS
description: Local voice assistant with real conversations (keyword spotting, ASR, local LLM with web search and weather tools, TTS) built from Arduino's built-in bricks.
ports: []
bricks:
- arduino:llm: {}
- arduino:asr: {}
- arduino:keyword_spotting: {}  # default model: wake word "Hey Arduino"
- arduino:tts:
    model: piper-tts-en  # German: piper-tts-de, together with LANGUAGE = "de" in python/config.py
- arduino:weather_forecast: {}
- arduino:sound_generator: {}
icon: 🎙️
